<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app ocupa toda la pantalla del iPhone; los bordes
         se respetan con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tu encomienda viaja con alguien que ya va para allá." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lapticon" />
    <!-- Barra de estado transparente: el contenido respeta safe-area-inset-top
         (nada difuminado detrás de la hora y la batería). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lapticon</title>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>Lapticon necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
